<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Workspace - System Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-tr from-slate-950 via-slate-900 to-indigo-950 flex items-center justify-center h-screen px-4">
    <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Initialize Profile</h2>
            <p class="text-xs text-slate-500 mt-1">Create credentials to access predictive metrics</p>
        </div>
        
        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Username</label>
                <input type="text" name="username" required placeholder="Choose a unique username" 
                       class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm text-slate-800">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Email Address</label>
                <input type="email" name="email" required placeholder="username@college.edu" 
                       class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm text-slate-800">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Password</label>
                <input type="password" name="password" required placeholder="Create a strong password" 
                       class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm text-slate-800">
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 text-xs uppercase tracking-wider mt-2 cursor-pointer">
                Register Profile
            </button>
        </form>
        
        <div class="text-center mt-6 border-t border-slate-100 pt-4">
            <p class="text-xs text-slate-500">Already possess a workspace? <a href="/login" class="text-indigo-600 font-bold hover:underline">Sign in</a></p>
        </div>
    </div>
</body>
</html>
