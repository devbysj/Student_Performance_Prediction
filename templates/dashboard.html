<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predictive Analytics Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen antialiased">
    <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white pt-12 pb-28 px-8 text-center shadow-md relative">
        <div class="absolute top-4 right-8 flex items-center space-x-4">
            <span class="text-xs uppercase tracking-widest text-indigo-200">User: <strong class="text-white font-bold">{{ session['username'] }}</strong></span>
            <a href="/logout" class="bg-rose-600 hover:bg-rose-700 text-xs px-3 py-1.5 rounded-xl font-medium transition shadow-md shadow-rose-600/20">Logout</a>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight sm:text-4xl">Student Performance Prediction Workspace</h1>
        <p class="text-indigo-200 text-sm mt-2 max-w-xl mx-auto">Input lifestyle parameters below to compute non-linear diagnostic performance models.</p>
    </div>

    <div class="max-w-2xl mx-auto -mt-16 px-4 pb-16">
        <div class="bg-white p-8 rounded-2xl shadow-2xl border border-slate-100">
            <div class="border-b border-slate-100 pb-3 mb-6">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-800">Operational Feature Matrix</h2>
                <p class="text-xs text-slate-400">Fill all criteria to run evaluation array</p>
            </div>
            
            <form action="/dashboard" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500">Attendance Ratio (%)</label>
                    <input type="number" step="any" name="attendance" min="0" max="100" required placeholder="e.g. 85" class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500">Daily Study Target (Hours)</label>
                    <input type="number" step="any" name="daily_study_hours" min="0" max="24" required placeholder="e.g. 3.5" class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500">Previous Evaluation Grade (%)</label>
                    <input type="number" step="any" name="prev_grade" min="0" max="100" required placeholder="e.g. 75" class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500">Extracurricular Engagement</label>
                    <select name="extracurricular" class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm bg-white">
                        <option value="1">Active / Involved</option>
                        <option value="0">None / Inactive</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wide text-slate-500">Daily Sleep (Hrs)</label>
                        <input type="number" step="any" name="sleep_hours" min="0" max="24" required placeholder="e.g. 7.5" class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wide text-slate-500">Social Media Usage (Hrs)</label>
                        <input type="number" step="any" name="social_media" min="0" max="24" required placeholder="e.g. 2.0" class="w-full mt-1 p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-900 hover:bg-slate-900 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-xl shadow-indigo-950/20 tracking-wide uppercase text-xs mt-4">Calculate Performance Metrics</button>
            </form>
        </div>
    </div>
</body>
</html>
