<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRALEARN_AI | Student Performance Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center text-white font-sans overflow-hidden">
    
    <!-- Decorative background glow -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl"></div>

    <div class="relative z-10 max-w-5xl mx-auto px-6 text-center">
        
        <!-- Hero Title -->
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400">
            ASTRALEARN_AI
        </h1>
        
        <!-- Hero Subtitle -->
        <p class="text-lg md:text-2xl text-slate-300 mb-10 max-w-3xl mx-auto leading-relaxed">
            Proactively identify your academic trajectory. Map your daily habits, attendance, and rest cycles to real-time performance predictions using an advanced Random Forest regression engine.
        </p>
        
        <!-- Call to Action Buttons -->
        <div class="flex flex-col sm:flex-row justify-center gap-5">
            <a href="/login" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold text-lg transition-all duration-300 shadow-[0_0_20px_rgba(79,70,229,0.4)] transform hover:-translate-y-1">
                Access Workspace
            </a>
            <a href="/register" class="px-8 py-4 bg-white/5 hover:bg-white/10 backdrop-blur-lg border border-white/10 text-white rounded-xl font-semibold text-lg transition-all duration-300 shadow-lg transform hover:-translate-y-1">
                Register Account
            </a>
        </div>
    </div>

</body>
</html>
